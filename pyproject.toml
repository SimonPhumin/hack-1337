[project]
name = "hack-1337"
version = "2.0.0"
description = "Build scripts for Hack 1337: Hack + native ligatures + Nerd Fonts"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fonttools[woff]>=4.50",
    "skia-pathops>=0.8",
    "uharfbuzz>=0.40",
]

[tool.uv]
package = false

[dependency-groups]
# make previews
previews = [
    "freetype-py>=2.5",
    "pillow>=11",
]
